<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#00209F" />
<meta name="robots" content="noindex, nofollow" />
<title>Konkou — Gestion des retraits</title>
<link rel="icon" href="icon.png" type="image/png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="admin.js"></script>
  <!-- Nécessaire pour les notifications push (voir push-client.js/webpush.js, juillet
       2026) : PushManager exige un service worker actif (navigator.serviceWorker.ready),
       qui n'existait jusqu'ici que sur index.html (voir sw-register.js, déjà utilisé côté
       joueur pour le mode hors-ligne). Le même sw.js, enregistré à la racine "/", couvre
       tout le domaine — donc /admin.html et /index.html partagent le même service worker
       plutôt que d'en avoir besoin d'un séparé. -->
  <script src="sw-register.js"></script>
</body>
</html>
